# NOTE: never executed — Docker is not installed on the authoring machine.
# See the header comment in ./Dockerfile.
#
# CRM-migration Step 5 (2026-10-26) — the `db` Postgres service (and the
# `DATABASE_URL`/`depends_on` wiring that pointed `web` at it) is REMOVED,
# reversing the 2026-09-17 override recorded in this file's own prior
# history: the content database and the admin CMS it backed are deleted
# outright, not merely disconnected. This is the LOCAL development compose
# file only — nothing here ever touched, and this change does not touch,
# any deployed/live database; that system, if one still exists for an
# unrelated purpose, is configured and managed entirely outside this repo.
#
# The site is now a pure client of the CRM's public API (documentation/
# technical-specification/public-website.md) over HTTP — there is nothing
# for a local compose service to provide.

services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Bind-mount source for hot reload, but keep container-side node_modules
      # and .next so host artifacts (and host-arch binaries) don't leak in.
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
